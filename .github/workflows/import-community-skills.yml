name: Import Pinned Community Skills

on:
  push:
    branches: ["feature/**"]
    paths:
      - "scripts/import_community_skills.py"
      - "src/zexa/skillpacks.py"
      - ".github/workflows/import-community-skills.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: zexa-skill-import-${{ github.ref }}
  cancel-in-progress: false

jobs:
  import:
    if: github.repository == 'sunnyprajapati1947-coder/Zexa'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout current feature branch
        uses: actions/checkout@v7
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Validate pinned community skills and import disabled references
        run: |
          if [ -e skillpacks/imported ]; then
            echo "skillpacks/imported already exists; refusing to overwrite imported user data."
            exit 1
          fi
          python scripts/import_community_skills.py
      - name: Verify generated manifest
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          manifest = json.loads(Path("skillpacks/imported/index.json").read_text(encoding="utf-8"))
          assert manifest["imported_count"] >= 300, manifest["imported_count"]
          assert manifest["enabled_count"] == 0, manifest["enabled_count"]
          assert all(item["enabled"] is False for item in manifest["skills"])
          print(f"Validated {manifest['imported_count']} imported, disabled skills.")
          PY
      - name: Run Python and shell regression checks
        run: |
          python -m pip install -e .
          python -m compileall -q src tests
          python -m unittest discover -s tests -v
          bash -n scripts/install-termux-worker.sh scripts/install-termux-boot.sh
      - name: Commit imported reference pack to this branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add skillpacks/imported/
          if git diff --cached --quiet; then
            echo "No imported skill changes to commit."
            exit 0
          fi
          git commit -m "Import pinned community skill references (disabled by default)"
          git fetch origin "$GITHUB_REF_NAME"
          git rebase "origin/$GITHUB_REF_NAME"
          git push origin "HEAD:${GITHUB_REF_NAME}"
