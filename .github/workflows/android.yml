name: Android Bridge Build

on:
  push:
    branches: [main, "feature/**", "fix/**"]
    paths:
      - "app/**"
      - "*.gradle.kts"
      - "settings.gradle.kts"
      - "gradle.properties"
      - ".github/workflows/android.yml"
  pull_request:
    branches: [main, "feature/**"]
    paths:
      - "app/**"
      - "*.gradle.kts"
      - "settings.gradle.kts"
      - "gradle.properties"
      - ".github/workflows/android.yml"
  workflow_dispatch:

concurrency:
  group: android-${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  assemble:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v4
        with:
          packages: "platform-tools"
      - name: Install Android SDK 36
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0" "ndk;27.2.12479018" "cmake;3.22.1"
      - uses: gradle/gradle-build-action@v3
        with:
          gradle-version: "8.11.1"
          arguments: --no-daemon :app:testDebugUnitTest :app:assembleDebug
      - name: Verify APK and native 16 KB page alignment
        shell: bash
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/debug/app-debug.apk"
          LIB="$RUNNER_TEMP/libzexa_llama.so"
          test -s "$APK"
          "$ANDROID_HOME/build-tools/36.0.0/zipalign" -c -P 16 -v 4 "$APK"
          unzip -p "$APK" lib/arm64-v8a/libzexa_llama.so > "$LIB"
          "$ANDROID_HOME/ndk/27.2.12479018/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-readelf" -lW "$LIB" > "$RUNNER_TEMP/elf-program-headers.txt"
          python - "$RUNNER_TEMP/elf-program-headers.txt" <<'PY'
          import pathlib
          import sys

          loads = []
          for line in pathlib.Path(sys.argv[1]).read_text().splitlines():
              fields = line.split()
              if fields and fields[0] == "LOAD":
                  loads.append(int(fields[-1], 16))
          if not loads:
              raise SystemExit("FAIL: no PT_LOAD segments found")
          bad = [value for value in loads if value < 16384]
          if bad:
              raise SystemExit("FAIL: PT_LOAD alignment below 16 KB: " + ", ".join(hex(v) for v in bad))
          print(f"PASS: all {len(loads)} PT_LOAD segments use at least 16 KB alignment")
          PY            $1 == "LOAD" {
              align = $NF
              if (align !~ /^0x[0-9a-fA-F]+$/ || strtonum(align) < 16384) {
                print "FAIL: PT_LOAD alignment is below 16 KB: " align
                failed = 1
              }
              count++
            }
            END {
              if (count == 0) {
                print "FAIL: no PT_LOAD segments found"
                exit 1
              }
              if (failed) exit 1
              print "PASS: all " count " PT_LOAD segments use at least 16 KB alignment"
            }'
      - uses: actions/upload-artifact@v7
        with:
          name: zexa-bridge-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
